<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Saravana-NX AR Menu</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
    #help{position:fixed;z-index:10;left:12px;right:12px;bottom:14px;padding:12px 14px;
      background:rgba(0,0,0,.72);color:#fff;border-radius:12px;text-align:center;font-size:14px}
    #title{position:fixed;z-index:10;top:14px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,.7);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700}
  </style>
</head>
<body>
  <div id="title">SARAVANA-NX • AR MENU</div>
  <div id="help">Allow camera access, then point the camera at the Hiro marker. The menu will appear in AR.</div>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="logarithmicDepthBuffer:true; precision:high;"
    arjs="sourceType:webcam; debugUIEnabled:false;">

    <a-marker preset="hiro">
      <!-- Main floating menu panel -->
      <a-plane
        position="0 0.15 0"
        rotation="-90 0 0"
        width="3.2"
        height="2.25"
        material="src:url(menu.png); shader:flat; transparent:false;">
      </a-plane>

      <!-- Floating 3D-style title -->
      <a-text
        value="SARAVANA-NX"
        position="0 1.55 0"
        rotation="-90 0 0"
        align="center"
        width="4"
        color="#FFD54A"
        side="double">
      </a-text>

      <!-- Simple floating action buttons -->
      <a-box position="-1.05 1.15 0" rotation="-90 0 0" width=".9" height=".28" depth=".08" color="#159447"></a-box>
      <a-text value="MENU" position="-1.05 1.16 .05" rotation="-90 0 0" align="center" width="2.5" color="white"></a-text>

      <a-box position="1.05 1.15 0" rotation="-90 0 0" width=".9" height=".28" depth=".08" color="#159447"></a-box>
      <a-text value="ORDER" position="1.05 1.16 .05" rotation="-90 0 0" align="center" width="2.5" color="white"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
