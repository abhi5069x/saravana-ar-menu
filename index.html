<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Saravana-NX AR Menu</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #title {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 18px;
      border-radius: 20px;

      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }

    #help {
      position: fixed;
      bottom: 20px;
      left: 5%;
      width: 90%;
      z-index: 10;

      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px;
      box-sizing: border-box;
      border-radius: 15px;

      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="title">SARAVANA-NX • AR MENU</div>

  <div id="help">
    Allow camera access and point your camera at the printed menu.
    <br>
    The AR menu will appear automatically.
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiError: no;
      uiScanning: yes;
      filterMinCF: 0.0005;
      filterBeta: 0.0005;
    "
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- MENU -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-plane
        src="./menu.png"
        position="0 0 0"
        rotation="0 0 0"
        width="1.4"
        height="1.0"
        material="shader: flat;">
      </a-plane>

    </a-entity>

  </a-scene>

</body>
</html>
